<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <!-- Background styling -->
    <radialGradient id="bg-glow" cx="50%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#141417" />
      <stop offset="60%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#040405" />
    </radialGradient>

    <!-- Subtle grid -->
    <pattern id="grid-pattern" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1" />
    </pattern>

    <!-- Card glow -->
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>

    <linearGradient id="icon-inner-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>

    <filter id="badge-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="640" fill="url(#bg-glow)" />
  <rect width="1280" height="640" fill="url(#grid-pattern)" />

  <!-- Center Content Container -->
  <g transform="translate(640, 310)">

    <!-- Ambient Center Light -->
    <circle cx="0" cy="-30" r="260" fill="#ffffff" fill-opacity="0.018" filter="blur(40px)" />

    <!-- Icon Badge -->
    <g transform="translate(0, -118)" filter="url(#badge-shadow)">
      <!-- Outer rounded squircle container -->
      <rect x="-56" y="-56" width="112" height="112" rx="28" fill="#0d0d10" stroke="url(#card-border)" stroke-width="1.5" />
      <rect x="-56" y="-56" width="112" height="112" rx="28" fill="url(#icon-inner-glow)" />

      <!-- Official Shadlet Icon (white foreground for dark mode) -->
      <g transform="translate(-37, -36) scale(0.24)">
        <path fill="#fafafa" fill-rule="evenodd" d="M 22 13 L 7 31 L 0 56 L 0 247 L 6 270 L 17 285 L 37 298 L 53 302 L 255 302 L 269 299 L 290 286 L 303 268 L 308 249 L 308 54 L 304 37 L 292 18 L 271 4 L 254 0 L 55 0 L 37 4 Z M 238 146 L 241 151 L 241 193 L 236 205 L 229 213 L 217 220 L 91 274 L 82 275 L 74 270 L 72 266 L 72 223 L 74 216 L 80 206 L 87 199 L 98 193 L 182 156 L 136 162 L 119 166 L 108 166 L 108 164 L 125 162 L 150 154 L 206 143 L 233 143 Z M 238 49 L 239 52 L 239 90 L 234 103 L 225 113 L 214 119 L 207 121 L 188 130 L 176 134 L 152 145 L 110 162 L 107 165 L 96 168 L 88 172 L 75 173 L 68 167 L 67 164 L 67 121 L 72 108 L 81 98 L 89 93 L 119 81 L 135 73 L 149 68 L 156 64 L 158 64 L 203 44 L 207 43 L 230 43 L 234 45 Z"/>
      </g>
    </g>

    <!-- Brand Name (all lowercase) -->
    <text x="0" y="56" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Geist', 'Inter', 'Segoe UI', sans-serif" font-size="64" font-weight="700" letter-spacing="-0.035em" fill="#fafafa">
      shadlet
    </text>

    <!-- Tagline (all lowercase, clean, crisp) -->
    <text x="0" y="104" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Geist', 'Inter', 'Segoe UI', sans-serif" font-size="20" font-weight="400" letter-spacing="-0.01em" fill="#8e8e93">
      python apps with an authentic shadcn/ui renderer
    </text>

    <!-- Pill Badges (all lowercase, no em dash, technical pill tags) -->
    <g transform="translate(0, 168)">
      <!-- Pill 1: pure python -->
      <g transform="translate(-250, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="16" fill="#141417" stroke="#27272a" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Geist Mono', 'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#a1a1aa">
          pure python
        </text>
      </g>

      <!-- Pill 2: shadcn / base-ui -->
      <g transform="translate(-80, 0)">
        <rect x="-75" y="-16" width="150" height="32" rx="16" fill="#141417" stroke="#27272a" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Geist Mono', 'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#a1a1aa">
          shadcn / base-ui
        </text>
      </g>

      <!-- Pill 3: native desktop -->
      <g transform="translate(90, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="16" fill="#141417" stroke="#27272a" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Geist Mono', 'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#a1a1aa">
          native desktop
        </text>
      </g>

      <!-- Pill 4: zero-config build -->
      <g transform="translate(255, 0)">
        <rect x="-70" y="-16" width="140" height="32" rx="16" fill="#141417" stroke="#27272a" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Geist Mono', 'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#a1a1aa">
          zero-config build
        </text>
      </g>
    </g>

  </g>

  <!-- Subtle bottom border hairline -->
  <line x1="0" y1="639" x2="1280" y2="639" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
</svg>