name: ci

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/renderer/package-lock.json
      - working-directory: packages/renderer
        run: npm ci
      - working-directory: packages/renderer
        run: npm run lint
      - working-directory: packages/renderer
        run: npm run format:check
      - working-directory: packages/renderer
        run: npm run typecheck
      - working-directory: packages/renderer
        run: npm run test
      - working-directory: packages/renderer
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: renderer-dist
          path: packages/renderer/dist

  python:
    runs-on: ubuntu-latest
    needs: renderer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: renderer-dist
          path: packages/renderer/dist
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv venv --python 3.11
      - run: uv pip install -e '.[dev]'
      - run: uv run ruff check packages/python tests
      - run: uv run ruff format --check packages/python tests
      - run: uv run mypy packages/python/shadlet
      - run: uv run pyright packages/python/shadlet
      - run: uv run pytest -q
