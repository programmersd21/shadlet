name: ci

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/renderer/package-lock.json
      - working-directory: packages/renderer
        run: npm ci
      - working-directory: packages/renderer
        run: npm run lint
      - working-directory: packages/renderer
        run: npm run format:check
      - working-directory: packages/renderer
        run: npm run typecheck
      - working-directory: packages/renderer
        run: npm run test
      - working-directory: packages/renderer
        run: npm run generate:icons
      - working-directory: packages/renderer
        run: git diff --exit-code -- src/shadlet/icon-data.generated.json ../../packages/python/shadlet/components/icon_data.py
      - working-directory: packages/renderer
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: renderer-dist
          path: packages/renderer/dist

  python:
    runs-on: ubuntu-latest
    needs: renderer
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: renderer-dist
          path: packages/renderer/dist
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv venv --python ${{ matrix.python-version }}
      - run: uv pip install -e '.[dev]'
      - if: matrix.python-version == '3.11'
        run: uv run ruff check .
      - if: matrix.python-version == '3.11'
        run: uv run ruff format --check .
      - if: matrix.python-version == '3.11'
        run: uv run mypy .
      - if: matrix.python-version == '3.11'
        run: uv run pyright .
      - if: matrix.python-version == '3.11'
        run: uv run python tooling/benchmarks/runtime.py --iterations 2 --warmups 1
      - run: uv run pytest -q

  browser-e2e:
    runs-on: ubuntu-latest
    needs: renderer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: renderer-dist
          path: packages/renderer/dist
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/renderer/package-lock.json
      - working-directory: packages/renderer
        run: npm ci
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv python install 3.11
      - run: uv venv --python 3.11
      - run: uv pip install -e '.[dev]'
      - working-directory: packages/renderer
        run: npx playwright install --with-deps chromium firefox webkit
      - working-directory: packages/renderer
        run: npm run test:e2e

  packaging:
    runs-on: ubuntu-latest
    needs: renderer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: renderer-dist
          path: packages/renderer/dist
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv build
      - name: verify wheel contents
        run: |
          unzip -l dist/*.whl | grep -q 'shadlet/web/static/index.html'
          unzip -l dist/*.whl | grep -q 'shadlet/web/static/assets/index-'
          unzip -l dist/*.whl | grep -q 'shadlet/templates/builtin/minimal/main.py'
          unzip -l dist/*.whl | grep -q 'shadlet/components/icon_data.py'
          unzip -l dist/*.whl | grep -q 'shadlet/THIRD_PARTY_NOTICES.md'
      - name: install wheel in a clean environment
        run: |
          uv venv --python 3.11 /tmp/shadlet-install
          uv pip install --python /tmp/shadlet-install/bin/python dist/*.whl
          /tmp/shadlet-install/bin/python -c "import shadlet; from shadlet.web.server import create_web_app; app = shadlet.App(); create_web_app(app); print(shadlet.__version__)"
          /tmp/shadlet-install/bin/shadlet info

  deployment-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build the documented Docker deployment
        run: docker build -f examples/deployment/Dockerfile -t shadlet-example .
