name: ci

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv venv --python 3.11
      - run: uv pip install -e '.[dev]'
      - run: uv run ruff check packages/python tests
      - run: uv run ruff format --check packages/python tests
      - run: uv run mypy packages/python/shadlet
      - run: uv run pyright packages/python/shadlet
      - run: uv run pytest -q

  renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/renderer/package-lock.json
      - working-directory: packages/renderer
        run: npm ci
      - working-directory: packages/renderer
        run: npm run typecheck
      - working-directory: packages/renderer
        run: npm run test
      - working-directory: packages/renderer
        run: npm run build
